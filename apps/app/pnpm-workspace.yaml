# apps/app is its own pnpm root (nested inside the monorepo on purpose):
# React Native / Metro tooling expects a flat node_modules, and keeping the
# lockfile here leaves the monorepo lockfile untouched.
packages:
  - "."
nodeLinker: hoisted
shamefullyHoist: true
allowBuilds:
  # Optional bunyan/DTrace native telemetry pulled by eas-cli is not required.
  dtrace-provider: false
  unrs-resolver: true
verifyDepsBeforeRun: false
overrides:
  uuid@7.0.3: 11.1.1
patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
