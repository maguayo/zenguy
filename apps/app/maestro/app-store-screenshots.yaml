# Capture the five App Store views from a Release simulator build created from
# the exact candidate commit. Inject MAESTRO_REVIEW_EMAIL and
# MAESTRO_REVIEW_PASSWORD from the approved password manager/environment; never
# commit them or pass their values on the command line.
appId: com.zenguy.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- tapOn:
    id: "signin-email"
- inputText: ${MAESTRO_REVIEW_EMAIL}
- tapOn:
    id: "signin-password"
- inputText: ${MAESTRO_REVIEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "signin-submit"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Usage this cycle"
    timeout: 30000
- tapOn:
    text: "Not now"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 01-overview

# Completed browser-run evidence.
- tapOn:
    id: "tab-tests"
- extendedWaitUntil:
    visible: ".*Blog listing.*"
    timeout: 20000
- tapOn: ".*Blog listing.*"
- extendedWaitUntil:
    visible: ".*Configuration.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "app-store-run"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "app-store-run"
- extendedWaitUntil:
    visible: ".*Run details.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ".*Evidence.*screenshot.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-test-run-evidence

# Uptime response-time view.
- tapOn:
    id: "tab-uptime"
- extendedWaitUntil:
    visible: ".*Status API.*"
    timeout: 20000
- tapOn: ".*Status API.*"
- extendedWaitUntil:
    visible: "Response time.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 03-uptime

# Incident timeline.
- tapOn:
    id: "tab-incidents"
- extendedWaitUntil:
    visible: ".*Search filters.*"
    timeout: 20000
- tapOn: ".*Search filters.*"
- extendedWaitUntil:
    visible: ".*Timeline.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 04-incident

# Notification channels and optional push controls.
- tapOn:
    id: "tab-more"
- extendedWaitUntil:
    visible: ".*Notifications.*"
    timeout: 20000
- tapOn: ".*Notifications.*"
- extendedWaitUntil:
    visible: ".*Mobile push.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05-notifications
