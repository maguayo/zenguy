http_port 3128
pid_filename none

# The runner network is fixed in compose.yml. The proxy itself holds no
# application credentials and accepts traffic only from that internal subnet.
acl runner_net src 172.30.0.0/24
acl CONNECT method CONNECT
acl SSL_ports port 443
acl safe_ports port 80 443

# Supplied by the host as a root-owned read-only bind. This blocks the VPS's
# public interface addresses as well as its private ones; otherwise a public
# DNS name could still pivot back into a service on the Docker host.
include /etc/squid/host-egress-deny.conf

# Resolve/check destinations in the proxy, at the actual network boundary.
# This covers redirects, subresources, WebSockets over CONNECT, workers and a
# renderer compromised below the CDP interception layer.
acl forbidden_v4 dst 0.0.0.0/8
acl forbidden_v4 dst 10.0.0.0/8
acl forbidden_v4 dst 100.64.0.0/10
acl forbidden_v4 dst 127.0.0.0/8
acl forbidden_v4 dst 169.254.0.0/16
acl forbidden_v4 dst 172.16.0.0/12
acl forbidden_v4 dst 192.0.0.0/24
acl forbidden_v4 dst 192.0.2.0/24
acl forbidden_v4 dst 192.88.99.0/24
acl forbidden_v4 dst 192.168.0.0/16
acl forbidden_v4 dst 198.18.0.0/15
acl forbidden_v4 dst 198.51.100.0/24
acl forbidden_v4 dst 203.0.113.0/24
acl forbidden_v4 dst 224.0.0.0/4
acl forbidden_v4 dst 240.0.0.0/4
acl forbidden_v6 dst ::/128
acl forbidden_v6 dst ::1/128
acl forbidden_v6 dst ::ffff:0:0/96
acl forbidden_v6 dst 64:ff9b::/96
acl forbidden_v6 dst 64:ff9b:1::/48
acl forbidden_v6 dst 100::/64
acl forbidden_v6 dst fc00::/7
acl forbidden_v6 dst fe80::/10
acl forbidden_v6 dst fec0::/10
acl forbidden_v6 dst ff00::/8
# Cover the IETF special-purpose assignments as a block.  The narrower entries
# below are retained as explicit documentation of the best-known tunnels and
# benchmark/documentation ranges.
acl forbidden_v6 dst 2001::/23
acl forbidden_v6 dst 2001::/32
acl forbidden_v6 dst 2001:2::/48
acl forbidden_v6 dst 2001:db8::/32
acl forbidden_v6 dst 2001:10::/28
acl forbidden_v6 dst 2001:20::/28
acl forbidden_v6 dst 2002::/16

http_access deny !safe_ports
http_access deny CONNECT !SSL_ports
http_access deny forbidden_host
http_access deny forbidden_v4
http_access deny forbidden_v6
http_access allow runner_net
http_access deny all

cache_dir null /tmp
cache deny all
cache_mem 8 MB
maximum_object_size 0 KB
# Bound plaintext HTTP responses at the proxy itself. HTTPS CONNECT traffic is
# additionally bounded by Chromium's CDP transfer quota and by the runner
# memory cgroup; attachments/PDFs are rejected before their response body.
reply_body_max_size 32 MB all
# Full proxy access logs contain plaintext HTTP paths/query strings. Those may
# carry reset links or other capabilities supplied as test URLs, so do not
# persist request targets from untrusted jobs. Runtime outcome/audit events are
# emitted by the runner after URL sanitization instead.
access_log none
cache_log /dev/stderr
forwarded_for delete
via off
request_header_access Proxy-Authorization deny all
request_header_access X-Forwarded-For deny all
