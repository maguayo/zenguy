name: Staging deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  security-gates:
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  test-migrate-deploy:
    if: github.ref == 'refs/heads/staging'
    needs: security-gates
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://staging-app.zenguy.com
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Typecheck API
        working-directory: apps/api
        run: pnpm typecheck
      - name: API unit tests
        working-directory: apps/api
        run: pnpm test
      - name: API integration tests
        working-directory: apps/api
        run: pnpm test:integration
      - name: Typecheck admin
        working-directory: apps/admin
        run: pnpm typecheck
      - name: Admin unit tests
        working-directory: apps/admin
        run: pnpm test
      - name: Admin integration tests
        working-directory: apps/admin
        run: pnpm test:integration
      - name: Verify staging commit is still the current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/staging" --jq .object.sha)"
          test "$GITHUB_SHA" = "$current_sha"
      - name: Verify required staging Worker secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:preflight:staging
      - name: Deploy private staging key-wrapping Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:kms:staging
      - name: Migrate staging D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate:staging
      - name: Verify staging commit before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/staging" --jq .object.sha)"
          test "$GITHUB_SHA" = "$current_sha"
      - name: Deploy staging Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:staging
