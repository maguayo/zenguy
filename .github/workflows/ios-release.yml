name: iOS release

on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-production-release
  cancel-in-progress: false

jobs:
  build-and-submit:
    # Manual dispatch is accepted only while viewing an immutable release tag.
    # Protect exact release tags and the release environment remotely.
    if: github.repository == 'maguayo/zenguy' && github.ref_type == 'tag' && startsWith(github.ref_name, 'ios-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZENGUY_ENFORCE_TRACKED_RELEASE_ARTIFACTS: "1"
    environment:
      name: ios-production-release
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node apps/app/scripts/verify-release-tag.mjs release "$GITHUB_REF_NAME"
          tag_sha="$(git rev-list -n 1 "$GITHUB_SHA")"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$tag_sha" = "$current_sha"

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install iOS dependencies from lock
        working-directory: apps/app
        run: pnpm install --frozen-lockfile

      - name: Check Expo dependency compatibility
        working-directory: apps/app
        run: pnpm exec expo install --check

      - name: Run pinned Expo Doctor
        working-directory: apps/app
        run: pnpm exec expo-doctor

      - name: Validate repository release invariants
        run: node scripts/security/check-repository.mjs

      - name: Validate iOS app
        working-directory: apps/app
        run: pnpm verify:app-store-package && pnpm verify:release-config && pnpm typecheck && pnpm lint && pnpm test --runInBand --forceExit && pnpm test:release-tools

      - name: Validate deployed App Store prerequisites
        working-directory: apps/app
        run: pnpm verify:app-store-remotes

      - name: Verify this exact commit deployed successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_deployments="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/production.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )"
          test "$successful_deployments" -ge 1

      - name: Re-verify current main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-list -n 1 "$GITHUB_SHA")"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$tag_sha" = "$current_sha"

      - name: Build and submit the reviewed commit
        working-directory: apps/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_IOS_RELEASE_TOKEN }}
        run: >-
          pnpm dlx eas-cli@23.2.0 build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive
          --wait
          --freeze-credentials
