name: Security gates

on:
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-edge-audit:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: security-audit
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2

      - name: Audit live Cloudflare edge policy (read-only)
        env:
          CLOUDFLARE_SECURITY_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node scripts/security/audit-cloudflare-edge.mjs

  client-and-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.14

      - name: Audit hashed Python runner lock
        run: |
          python -m venv "$RUNNER_TEMP/runner-env"
          "$RUNNER_TEMP/runner-env/bin/pip" install --no-deps \
            --only-binary=:all: --require-hashes \
            --requirement runner/requirements.lock
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/pip" install pip-audit==2.10.1
          "$RUNNER_TEMP/audit-env/bin/pip-audit" \
            --path "$RUNNER_TEMP/runner-env/lib/python3.12/site-packages"

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Guard credentials and local secret permissions
        run: node scripts/security/check-repository.mjs

      - name: Validate memory-only Keychain secret transport
        run: >-
          timeout --signal=TERM --kill-after=5s 30s
          node --test apps/api/scripts/local-secrets.test.mjs

      - name: Test read-only remote-control guards
        run: node --test scripts/security/audit-cloudflare-edge.test.mjs apps/api/scripts/verify-remote-secrets.test.mjs apps/admin/scripts/verify-remote-secrets.test.mjs

      - name: Audit monorepo production dependencies
        run: |
          # Version-based scanners still report this dependency even though the
          # frozen lock applies and hashes our reviewed local security patch.
          pnpm audit --prod --audit-level high \
            --ignore GHSA-jmr9-qjv8-65gv

      - name: Audit iOS production dependencies
        working-directory: apps/app
        run: |
          # Expo Router 57 still uses CommonJS query-string 7. The ignored
          # version finding is covered by our sealed upstream-algorithm patch.
          pnpm audit --prod --audit-level moderate \
            --ignore GHSA-vcc3-ghjq-m6fr

      - name: Install monorepo dependencies from lock
        run: pnpm install --frozen-lockfile

      - name: Validate SPA
        run: pnpm --filter @zenguy/frontend build && pnpm --filter @zenguy/frontend test

      - name: Build public sites
        run: |
          pnpm --filter @zenguy/website test
          pnpm --filter @zenguy/website build
          pnpm --filter @zenguy/landing build
          node apps/app/scripts/verify-app-store-static-output.mjs

      - name: Install iOS dependencies from lock
        working-directory: apps/app
        run: pnpm install --frozen-lockfile

      - name: Verify local advisory patches
        run: node scripts/security/verify-dependency-patches.mjs

      - name: Validate iOS app
        working-directory: apps/app
        run: pnpm verify:release-config && pnpm typecheck && pnpm lint && pnpm test --runInBand --forceExit

      - name: Generate CycloneDX dependency inventory
        run: node scripts/security/generate-sbom.mjs "$RUNNER_TEMP/zenguy.cdx.json"

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zenguy-cyclonedx
          path: ${{ runner.temp }}/zenguy.cdx.json
          if-no-files-found: error
          retention-days: 30
